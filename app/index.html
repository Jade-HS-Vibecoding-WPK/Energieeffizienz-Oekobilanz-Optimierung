<style>
/* Layout: Bento-Grid auf hellgrauem Grund (immer hell), große Rundungen, Waldgrün-Palette; Schrift Nunito */
:root {

  --hero-a: #1f5a3d; --hero-b: #3a8059; --hero-ink: #ffffff;
  --good: #3b8455; --warn: #c8913a; --bad: #b5603d; --grey: #a3aca6;
  --c1: #1f5a3d; --c2: #5f9a6e; --c3: #a9c8a0; --c4: #c8913a; --c5: #7b8c93; --c6: #3e6f86; --c7: #b5653f;

  --fs-xs: 0.78rem; --fs-s: 0.85rem; --fs-m: 0.97rem; --fs-l: 1.15rem; --fs-xl: 1.6rem; --fs-xxl: 2.3rem;
  --r-tile: 28px; --r-card: 20px; --r-ctl: 12px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: var(--fs-m); line-height: 1.5; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }

.ico { flex: none; vertical-align: -3px; }

/* Kopf als Schriftfeld */
header.titleblock { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; border: 1px solid var(--line-strong); border-top: 0; background: var(--panel); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }

.brand h1 { font-size: 1.2rem; line-height: 1.1; }
.brand .sub { font-size: var(--fs-xs); color: var(--muted); }
.tb-project { display: flex; flex-direction: column; justify-content: center; }

}
.lang { display: inline-flex; border: 1px solid var(--line-strong); }

.card { background: var(--panel); border: 1px solid var(--line); padding: 16px; min-width: 0; }
.card.accent { border-color: var(--accent-line); }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

@media (max-width: 620px) {

}
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.banner { border: 1px solid var(--accent-line); background: var(--accent-soft); padding: 10px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* Formulare */
.f { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-s); color: var(--muted); min-width: 0; }
input[type="text"], input[type="number"], input[type="password"], select, textarea {
  font: inherit; font-size: var(--fs-m); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 0; padding: 7px 9px; width: 100%; min-width: 0; }
input[type="number"] { font-variant-numeric: tabular-nums; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { min-height: 70px; resize: vertical; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: var(--fs-s); color: var(--fg); cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); }
.seg button { border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--fg); padding: 6px 10px; cursor: pointer; font: 500 var(--fs-s) var(--font-body); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.btn { font: 600 var(--fs-s) var(--font-body); border: 1px solid var(--line-strong); background: var(--panel); color: var(--fg); padding: 8px 13px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; border-radius: 0; text-decoration: none; }
.btn:hover:not(:disabled) { background: var(--panel2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 4px 8px; font-size: var(--fs-xs); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.iconbtn { border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; padding: 4px; display: inline-grid; place-items: center; }
.iconbtn:hover { color: var(--fg); border-color: var(--line); }

/* Upload */
.drop { border: 1px dashed var(--accent-line); background: var(--bg); padding: 22px 16px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; cursor: pointer; }
.drop.over { background: var(--accent-soft); border-style: solid; }
.drop .ico { color: var(--accent); }
.filelist { display: flex; flex-direction: column; gap: 8px; }
.fileitem { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; border: 1px solid var(--line); padding: 6px; background: var(--panel); }
.fileitem img, .fileitem .ph { width: 56px; height: 44px; object-fit: cover; border: 1px solid var(--line); display: grid; place-items: center; background: var(--panel2); color: var(--muted); }
.fileitem .nm { font-size: var(--fs-s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fileitem select { width: auto; font-size: var(--fs-s); padding: 4px 6px; }

/* Tabellen */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); background: var(--panel); min-width: 0; max-width: 100%; }
.stack > *, .section > *, details > .body > *, .mcard > * { min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-s); }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-weight: 600; color: var(--muted); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; background: var(--panel2); white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td input[type="number"] { width: 92px; padding: 5px 6px; }
td select { padding: 5px 6px; font-size: var(--fs-s); min-width: 140px; }
td input[type="text"] { padding: 5px 6px; min-width: 120px; }
tr.sel td { background: var(--accent-soft); }
.layers { background: var(--panel2); }
.layers td { padding: 10px; }
.layertable td, .layertable th { background: transparent; }

/* Kennzeichen */
.f > .badge { align-self: flex-start; }
/* Feldbeschriftung mit Symbol oder Fragezeichen in einer Zeile, damit Felder bündig bleiben */
.flbl { display: inline-flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
[hidden] { display: none !important; }
/* Meine Projekte (Liste im Dialog) */
.pjlist { list-style: none; margin: 0; padding: 2px; display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; overflow-x: hidden; }
.pj { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--panel2); }
.pj.cur { box-shadow: inset 0 0 0 2px var(--accent); background: var(--panel); }
.pj-cls { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 0.95rem; }
.pj-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pj-main strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pj-act { flex: none; display: flex; gap: 6px; align-items: center; }
.btn.danger { background: #c2412d; border-color: #c2412d; color: #fff; }
#saveState { display: block; font-size: 0.68rem; font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; margin-top: 1px; }
.pj-empty { margin: 0; padding: 14px 16px; border-radius: 14px; background: var(--panel2); font-size: var(--fs-s); }
.pj-info { margin: 2px 0 0; padding: 12px 16px 12px 30px; border-radius: 14px; background: var(--t-mint); font-size: var(--fs-xs); color: var(--fg); display: flex; flex-direction: column; gap: 4px; }
.pj-info b { color: var(--accent); }
@media (max-width: 620px) { .pj { flex-wrap: wrap; } .pj-act { width: 100%; justify-content: flex-end; } }
/* Aufbau-Auswahl in der Bauteiltabelle: Feld wie eine Auswahlliste, Liste + Infofenster schweben darüber */
.conpick-btn { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-width: 180px; text-align: left;
  font: inherit; font-size: var(--fs-s); color: var(--fg); background: var(--panel2); border: 1px solid transparent; border-radius: var(--r-ctl); padding: 5px 8px 5px 10px; cursor: pointer; }
.conpick-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.conpick-btn .ico { flex: none; color: var(--fg); }
.conpick-btn:hover { background: var(--t-mint); }
.conpick-btn[aria-expanded="true"] { background: var(--panel); border-color: var(--accent); }
.conpick { position: fixed; z-index: 60; display: flex; align-items: flex-start; gap: 8px; }
.conpick.info-left { flex-direction: row-reverse; }
.conpick.info-below { flex-direction: column; }
.cp-list, .cp-info { background: var(--panel); border-radius: 16px; box-shadow: 0 18px 44px -18px rgb(20 50 35 / 0.45), 0 0 0 1px var(--line); }
.cp-list { width: var(--list-w, 300px); max-height: min(60vh, 420px); overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.cp-opt { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 7px 10px; font: inherit; font-size: var(--fs-s); color: var(--fg); cursor: pointer; }
.cp-opt .ico, .cp-sp { flex: none; width: 14px; color: var(--accent); }
.cp-opt.hov, .cp-opt:hover { background: var(--t-mint); }
.cp-opt[aria-selected="true"] { font-weight: 700; color: var(--accent); }
.cp-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.conpick.info-below .cp-info { width: var(--list-w, 340px); }
.cp-info { width: 340px; box-sizing: border-box; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; animation: cpIn 0.14s ease-out; }
@keyframes cpIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .cp-info { animation: none; } }
.ci-head { display: flex; flex-direction: column; gap: 2px; }
.ci-head strong { color: var(--accent); font-size: var(--fs-s); }
.ci-table { width: 100%; border-collapse: collapse; font-size: var(--fs-xs); }
.ci-table th { text-align: left; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.68rem; padding: 0 4px 4px; border-bottom: 1px solid var(--line); }
.ci-table td { padding: 4px; border-bottom: 1px solid var(--line); background: transparent; }
.ci-table .n { text-align: right; }
.ci-foot { display: flex; justify-content: space-between; gap: 10px; }
/* Projekt-Chat: Reiter am rechten Rand, Fenster fährt von rechts heraus */
.chat-tab { position: fixed; right: env(safe-area-inset-right, 0px); top: 30%; transform: translateY(-50%); z-index: 40;
  writing-mode: vertical-rl; display: inline-flex; align-items: center; gap: 8px; padding: 16px 10px; border: 0; border-radius: 18px 0 0 18px;
  background: var(--accent); color: var(--accent-ink); font: 800 0.88rem var(--font-body); cursor: pointer; box-shadow: -6px 8px 22px -12px var(--accent); }
.chat-tab .ico { transform: rotate(90deg); }
.chat-tab:hover { padding-right: 14px; filter: brightness(1.1); }
.chat-tab:focus-visible { outline: 3px solid var(--t-sage); outline-offset: 2px; }
.chat-count { writing-mode: horizontal-tb; background: var(--accent-ink); color: var(--accent); border-radius: 999px; font-size: 0.7rem; min-width: 20px; height: 20px; display: grid; place-items: center; }
.chat-panel { position: fixed; z-index: 45; top: calc(env(safe-area-inset-top, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); right: calc(env(safe-area-inset-right, 0px) + 16px);
  width: min(430px, calc(100vw - 32px)); background: var(--panel); border-radius: var(--r-tile); box-shadow: 0 24px 60px -20px rgb(20 50 35 / 0.45), 0 0 0 1px var(--line);
  display: flex; flex-direction: column; gap: 12px; padding: 18px; animation: chatIn 0.22s ease-out; }
@keyframes chatIn { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .chat-panel { animation: none; } }
.chat-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chat-head h3 { color: var(--accent); display: flex; gap: 8px; align-items: center; font-size: var(--fs-l); }
.chat-msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; min-height: 0; }
.chat-msgs .msg { max-width: 92%; }
.chat-quick { display: flex; flex-wrap: wrap; gap: 6px; }
@media (max-width: 620px) {
  .chat-tab { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); transform: none; writing-mode: horizontal-tb; border-radius: 999px; right: calc(env(safe-area-inset-right, 0px) + 16px); padding: 12px 16px; }
  .chat-tab .ico { transform: none; }
  .chat-panel { top: auto; height: min(78vh, 640px); left: calc(env(safe-area-inset-left, 0px) + 8px); right: calc(env(safe-area-inset-right, 0px) + 8px); bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); width: auto; }
}
/* KI-Status in der Fußzeile */
footer .ai-status { display: inline-flex; align-items: center; gap: 7px; margin-top: 6px; border: 0; background: transparent; padding: 2px 0; color: var(--muted); font: inherit; font-size: var(--fs-xs); cursor: pointer; text-align: left; }
footer .ai-status:hover { color: var(--accent); }
footer .ai-status .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
/* Hinweistexte in Karten dürfen die volle Kartenbreite nutzen */
.card > p.small { max-width: none; }
/* Umschalter in Formularen: nicht über die ganze Breite ziehen, beide Hälften gleich breit */
.f > .seg { align-self: flex-start; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.f > .seg button { text-align: center; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); padding: 1px 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.niedrig { border-color: var(--bad); color: var(--bad); } .badge.mittel { border-color: var(--warn); color: var(--warn); } .badge.hoch { border-color: var(--good); color: var(--good); }
.chip { display: inline-flex; font-size: var(--fs-xs); padding: 1px 7px; background: var(--panel2); border: 1px solid var(--line); color: var(--fg); white-space: nowrap; }
.dot { width: 10px; height: 10px; display: inline-block; flex: none; }
.st-ok { color: var(--good); } .st-near { color: var(--warn); } .st-fail { color: var(--bad); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 600; padding: 2px 8px; border: 1px solid currentColor; }
.grade { font-family: var(--font-display); font-weight: 700; display: inline-grid; place-items: center; width: 24px; height: 24px; border: 1px solid currentColor; }
.grade.A { color: var(--good); } .grade.B { color: var(--c2); } .grade.C { color: var(--warn); } .grade.D { color: var(--c7); } .grade.E { color: var(--bad); }

/* Kennzahlen */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line-strong); border-left: 1px solid var(--line); }
.kpi { padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .v { font-family: var(--font-display); font-size: var(--fs-xxl); font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .u { font-size: var(--fs-xs); color: var(--muted); }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi .v { font-size: 1.75rem; } }
.kpi .v .cls { display: inline-grid; place-items: center; min-width: 44px; height: 40px; padding: 0 6px; color: #fff; font-size: 1.5rem; }

/* Maßnahmen */
.mgroup { display: flex; flex-direction: column; gap: 8px; }
.mcard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; border: 1px solid var(--line); background: var(--panel); padding: 12px 14px; }
.mcard.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.mcard h4 { font-size: var(--fs-m); }
.mfig { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 4px 14px; margin-top: 8px; }
.mfig div { display: flex; flex-direction: column; }
.mfig .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.aitext { border-left: 2px solid var(--accent-line); padding-left: 10px; margin-top: 8px; font-size: var(--fs-s); }
.warn { color: var(--warn); font-size: var(--fs-xs); }

/* 3D */
.viewer { position: relative; border: 1px solid var(--line); background: linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 24px 24px, var(--panel); background-blend-mode: normal; }
.viewer .canvas { height: 440px; width: 100%; opacity: 1; }
.viewer .canvas canvas { display: block; }
.viewer .vtools { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: space-between; pointer-events: none; }
.viewer .vtools > * { pointer-events: auto; }
.viewer .legend { position: absolute; left: 8px; bottom: 8px; background: var(--panel); border: 1px solid var(--line); padding: 6px 8px; font-size: var(--fs-xs); display: flex; gap: 8px; align-items: center; }
.legend .ramp { width: 120px; height: 9px; background: linear-gradient(90deg, #2f8a45, #e4c33a, #c2412d); }
.viewer .hint { position: absolute; right: 8px; bottom: 8px; font-size: var(--fs-xs); color: var(--muted); background: var(--panel); padding: 2px 6px; border: 1px solid var(--line); }
.selpanel { border: 1px solid var(--accent-line); background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.sliders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.sliders select { font-size: var(--fs-xs); padding: 4px 6px; }
@media (max-width: 620px) { .viewer .canvas { height: 320px; } }

/* Chat */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 85%; padding: 9px 12px; border: 1px solid var(--line); background: var(--panel); white-space: pre-wrap; font-size: var(--fs-s); }
.msg.user { align-self: flex-end; background: var(--accent-soft); border-color: var(--accent-line); }
.chatform { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }

/* Fortschritt */
.progress { display: flex; flex-direction: column; gap: 8px; }
.progress .line { display: flex; gap: 10px; align-items: center; font-size: var(--fs-s); }
/* Ladesymbol im Bento-Stil: runder Ring in Salbei mit waldgrünem Bogen */
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--t-sage); border-top-color: var(--accent); border-right-color: var(--accent); animation: spin 0.8s cubic-bezier(.55, .15, .45, .85) infinite; flex: none; display: inline-block; vertical-align: -3px; }
.btn.primary .spinner, .chat-tab .spinner { border-color: rgb(255 255 255 / 0.35); border-top-color: #fff; border-right-color: #fff; }
.fileitem .ph .spinner { width: 20px; height: 20px; border-width: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Fortschrittsbalken: abgerundet, sanft hin und her laufend */
.bar { height: 8px; border-radius: 999px; background: var(--t-mint); position: relative; overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 35%; border-radius: 999px; background: linear-gradient(90deg, var(--c2), var(--accent)); animation: barslide 1.6s ease-in-out infinite; }
@keyframes barslide { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-color: var(--accent); } .bar i { animation: none; width: 100%; opacity: 0.6; } }

details { border: 1px solid var(--line); background: var(--panel); }
details > summary { cursor: pointer; padding: 9px 12px; font-weight: 600; font-size: var(--fs-s); list-style: none; display: flex; gap: 8px; align-items: center; }
details > summary::before { content: "+"; font-family: var(--font-display); width: 14px; color: var(--accent); }
details[open] > summary::before { content: "–"; }
details > .body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.formula { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: var(--fs-xs); background: var(--panel2); padding: 8px 10px; overflow-x: auto; white-space: pre; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 14px; font-size: var(--fs-s); z-index: 50; max-width: calc(100% - 32px); }
.modal { position: fixed; inset: 0; background: rgb(0 0 0 / 0.45); display: grid; place-items: center; z-index: 60; padding: 16px; }
.modal .box { background: var(--panel); border: 1px solid var(--line-strong); max-width: 640px; width: 100%; max-height: 85vh; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.help { border: 1px solid var(--line); background: transparent; color: var(--muted); width: 18px; height: 18px; display: inline-grid; place-items: center; font: 600 11px var(--font-body); cursor: pointer; padding: 0; vertical-align: 1px; }
.help:hover { color: var(--accent); border-color: var(--accent); }
.gloss dt { font-weight: 600; } .gloss dd { margin: 0 0 8px; color: var(--muted); font-size: var(--fs-s); }
footer { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 10px; font-size: var(--fs-xs); color: var(--muted); }
.best { font-weight: 700; color: var(--accent); }
.vcard { border: 1px solid var(--line); background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.vcard.active { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.empty { border: 1px dashed var(--line); padding: 18px; color: var(--muted); text-align: center; font-size: var(--fs-s); }

/* ===== Bento-Stil: große Rundungen, weiche Flächen ===== */
h1, h2, h3, h4 { font-weight: 800; letter-spacing: -0.005em; }
body { padding-block: 12px 40px; }
header.titleblock { border: 0; border-radius: var(--r-tile); background: var(--panel); overflow: hidden; position: static; }
.bento .eyebrow { hyphens: auto; overflow-wrap: break-word; letter-spacing: 0.06em; }
body::before { background: var(--bg); }
.tb-cell { border-color: var(--line); }
.brand-mark { border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); width: 36px; height: 36px; }
.brand h1 { font-size: 1.3rem; font-weight: 900; }
nav.steps { border: 0; border-radius: 999px; background: var(--panel); margin: 10px 0 22px; padding: 5px; gap: 4px; }
nav.steps button { border: 0; border-radius: 999px; padding: 9px 14px; }
nav.steps .n { border-radius: 999px; border: 0; background: var(--panel2); color: var(--muted); }
nav.steps button[aria-current="step"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
nav.steps button[aria-current="step"] .n { background: var(--accent-ink); color: var(--accent); }
nav.steps button.done .n { background: var(--accent-soft); color: var(--accent); }
.section-head { border-bottom: 0; padding-bottom: 0; }
.card { border: 0; border-radius: var(--r-card); }
.card.accent { background: var(--accent-soft); }
.btn { border-radius: 999px; border-color: var(--line-strong); font-weight: 700; }
.btn.primary { box-shadow: 0 6px 16px -10px var(--accent); }
.btn.ghost { border-color: transparent; }
.iconbtn { border-radius: 10px; }
input[type="text"], input[type="number"], input[type="password"], select, textarea { border-radius: var(--r-ctl); background: var(--panel2); border-color: transparent; }
input:focus-visible, select:focus-visible, textarea:focus-visible { background: var(--panel); }
.seg, .lang { border-radius: 999px; overflow: hidden; border-color: var(--line-strong); }
.seg button, .lang button { border-right: 0; }
.drop { border-radius: var(--r-card); border-width: 2px; }
.fileitem { border-radius: 16px; border: 0; background: var(--panel2); }
.fileitem img, .fileitem .ph { border-radius: 10px; border: 0; }
.tablewrap { border: 0; border-radius: 18px; }
th { background: var(--panel2); }
.badge, .chip, .pill { border-radius: 999px; }
.chip { background: var(--panel2); border-color: transparent; }
.grade { border-radius: 10px; border-width: 2px; }
.banner { border-radius: 20px; border: 0; }
.mcard { border: 0; border-radius: 20px; background: var(--panel2); }
.mcard.on { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
.aitext { border-left-width: 3px; }
.viewer { border: 0; border-radius: var(--r-tile); overflow: hidden; }
.viewer .legend, .viewer .hint { border-radius: 12px; border: 0; }
.selpanel { border: 0; border-radius: 20px; background: var(--accent-soft); }
.msg { border-radius: 18px; border: 0; background: var(--panel2); }
.msg.user { background: var(--accent-soft); }
.toast { border-radius: 999px; }
.modal .box { border: 0; border-radius: var(--r-tile); }
details { border: 0; border-radius: 18px; background: var(--panel2); }
.formula { border-radius: 12px; background: var(--panel); }
.vcard { border: 0; border-radius: var(--r-tile); }
.vcard.active { box-shadow: inset 0 0 0 2px var(--accent); }
.empty { border-radius: 20px; }
.help { border-radius: 999px; }
.kpis { border: 0; gap: 12px; }
.kpi { border: 0; border-radius: var(--r-card); }

/* Bento-Kacheln */
.bento { background: var(--panel); border-radius: var(--r-tile); padding: 22px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.bento > * { min-width: 0; }
.bento h3 { font-size: var(--fs-l); display: flex; gap: 8px; align-items: center; }
.bento .eyebrow { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.09em; font-weight: 800; color: var(--muted); }
.bento.sage { background: var(--t-sage); } .bento.mint { background: var(--t-mint); } .bento.ochre { background: var(--t-ochre); }
.bento.soft { background: var(--accent-soft); }
.bento.hero { background: radial-gradient(120% 90% at 100% 0%, var(--hero-b) 0%, var(--hero-a) 60%); color: var(--hero-ink); position: relative; overflow: hidden; }
.bento.hero .eyebrow, .bento.hero .muted { color: rgb(255 255 255 / 0.78); }
.bento.hero .help { color: #fff; border-color: rgb(255 255 255 / 0.5); }
.hero-num { font-weight: 900; font-size: clamp(4.5rem, 11vw, 8.5rem); line-height: 0.9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.hero-cls { font-weight: 900; font-size: clamp(2.6rem, 5vw, 3.6rem); line-height: 1; min-width: 1.6em; padding: 0.18em 0.28em; border-radius: 22px; text-align: center; box-shadow: 0 10px 30px -12px rgb(0 0 0 / 0.5); }
.hero-scale { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
.hero-scale span { height: 12px; border-radius: 999px; opacity: 0.85; }
.hero-scale span.on { opacity: 1; height: 18px; margin-top: -3px; box-shadow: 0 0 0 2px #fff; }
.hero-ring { position: absolute; right: -60px; bottom: -60px; width: 220px; height: 220px; border-radius: 999px; border: 28px solid rgb(255 255 255 / 0.07); pointer-events: none; }
.big { font-weight: 900; font-size: clamp(1.9rem, 3.2vw, 2.6rem); line-height: 1.02; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.target-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.target-row:last-child { border-bottom: 0; }
.bento .viewer .canvas { height: 470px; }
@media (max-width: 767px) { .bento { padding: 18px; } .bento .viewer .canvas { height: 320px; } }

/* ===== Waldgrün-Palette stärker einsetzen (Energieklassen behalten Originalfarben) ===== */
h2 { color: var(--accent); }
.bento.moss { background: var(--t-moss); } .bento.fern { background: var(--t-fern); }
.bento h3 .ico, .card h3 .ico { color: var(--accent); }
.btn { background: var(--t-mint); border-color: transparent; color: var(--accent); }
.btn:hover:not(:disabled) { background: var(--t-sage); }
.btn.primary { color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.bento.mint .btn:not(.primary), .bento.sage .btn:not(.primary), .bento.soft .btn:not(.primary) { background: var(--panel); }
.lang button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg, .lang { border-color: var(--accent-line); background: var(--panel); }
nav.steps .n { background: var(--t-mint); color: var(--accent); }
nav.steps button { color: var(--accent); }
nav.steps button:disabled { color: var(--muted); }
th { background: var(--t-mint); color: var(--accent); }
.drop { background: var(--t-mint); border-color: var(--accent-line); }
.drop:hover { background: var(--t-sage); }
.chip { background: var(--t-sage); color: var(--accent); }
.card { background: var(--panel); }
.card h3, .card h4 { color: var(--accent); }
.legend .ramp { background: linear-gradient(90deg, #5f9a6e, #e0b45c, #b5603d); }
.mcard.g-design { background: var(--t-sage); } .mcard.g-material { background: var(--t-mint); }
.mcard.g-envelope { background: var(--t-ochre); } .mcard.g-tech { background: var(--t-moss); }
.mcard.on { background: var(--panel); box-shadow: inset 0 0 0 3px var(--accent); }
.mgroup > .label { color: var(--accent); }
.target-row { border-bottom-color: rgb(31 90 61 / 0.15); }
.brand .sub { color: var(--accent); opacity: 0.8; }

/* ===== Kopfzeile: Logo links, Titel oben, darunter eine Zeile mit Unterzeile, Projekt und Knöpfen ===== */
header.titleblock { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 18px; padding: 16px 22px; }
/* Logo so hoch wie Titel-Oberkante bis Grundlinie der Unterzeile */
header.titleblock .brand-mark { width: 63px; height: 63px; border-radius: 19px; box-shadow: 0 10px 22px -12px var(--accent); }
header.titleblock .brand-mark .ico { width: 32px; height: 32px; }
.hb-main { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
/* Oberkante des Schriftzugs bündig mit der Oberkante des Logos (Ausgleich des Schrift-Innenabstands) */
.hb-title { font-size: clamp(1.7rem, 2.6vw, 2.2rem); line-height: 1; margin-top: var(--cap-shift, -0.075em); letter-spacing: -0.02em; color: var(--fg); font-weight: 900; }
.hb-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; min-width: 0; }
.hb-row .sub { font-size: 0.95rem; font-weight: 600; color: var(--accent); opacity: 0.85; }
.wrap { max-width: 1400px; }
header.titleblock .tb-project { flex-direction: column; gap: 0; padding: 0 0 0 16px; border-left: 1px solid var(--line); border-right: 0; min-width: 0; max-width: 260px; }
header.titleblock .tb-project .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.titleblock .tb-actions { gap: 5px; flex-wrap: nowrap; }
@media (max-width: 1300px) { header.titleblock .tb-actions { flex-wrap: wrap; } }
.tb-project .label { font-size: 0.68rem; }
.tb-project .v { font-size: 0.88rem; font-weight: 600; }
header.titleblock .tb-actions { margin-left: auto; padding: 0; border: 0; }
.tb-actions .btn.small, .tb-actions .lang button { font-size: 0.72rem; padding: 4px 9px; }
.tb-actions .btn.small .ico { width: 12px; height: 12px; }
.tb-actions .btn.newproj { font-size: 0.9rem; padding: 9px 18px; font-weight: 800; box-shadow: 0 8px 20px -8px var(--accent); }
.tb-actions .btn.newproj:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 24px -10px var(--accent); filter: brightness(1.1); }
@media (prefers-reduced-motion: reduce) { .tb-actions .btn.newproj:hover:not(:disabled) { transform: none; } }
@media (max-width: 1150px) { header.titleblock { grid-template-columns: auto minmax(0, 1fr); } header.titleblock .tb-actions { grid-column: auto; border-top: 0; } }
@media (max-width: 620px) {
  header.titleblock { grid-template-columns: auto minmax(0, 1fr); padding: 14px; gap: 12px; align-items: start; }
  header.titleblock .brand-mark { width: 48px; height: 48px; }
  header.titleblock .tb-project { border-left: 0; padding-left: 0; }
  header.titleblock .tb-actions { margin-left: 0; }
}

/* Mit dem Reiter „Normaler Zeiger“ (Klasse .plain-cursor) gelten wieder die üblichen Mauszeiger */
html:not(.plain-cursor), html:not(.plain-cursor) body, html:not(.plain-cursor) * { cursor: var(--cursor-foot) !important; }
html:not(.plain-cursor):active, html:not(.plain-cursor):active * { cursor: var(--cursor-foot-down) !important; }
html:not(.plain-cursor) :is(input[type="text"], input[type="number"], input[type="password"], textarea) { cursor: text !important; }

/* Reiter zum Umschalten des Mauszeigers – gleiche Form wie der Chat-Reiter, etwas kleiner, darunter */
.cursor-tab { position: fixed; right: env(safe-area-inset-right, 0px); top: calc(30% + 116px); z-index: 40;
  display: grid; place-items: center; width: 39px; height: 40px; padding: 0 0 0 2px; border: 0; border-radius: 14px 0 0 14px;
  background: var(--accent); color: var(--accent-ink); cursor: pointer; box-shadow: -6px 8px 22px -12px var(--accent); }
.cursor-tab svg { flex: none; }
.cursor-tab:hover { width: 43px; filter: brightness(1.1); }
.cursor-tab:focus-visible { outline: 3px solid var(--t-sage); outline-offset: 2px; }
@media (max-width: 620px), (pointer: coarse) { .cursor-tab { display: none; } }

/* Fußspur hinter dem Mauszeiger: kleine waldgrüne Abdrücke, die verblassen */
.foot-step { position: fixed; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; z-index: 9999;
  background: var(--cursor-step) center / contain no-repeat; opacity: 0; animation: footFade 1.2s ease-out forwards; }
@keyframes footFade { 0% { opacity: 0.7; } 55% { opacity: 0.4; } 100% { opacity: 0; } }

/* ===== Intro „Greenprint wird gezeichnet“ (einmal pro Sitzung) ===== */
#intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; cursor: pointer;
  background-color: var(--bg);
  background-image: linear-gradient(rgb(31 90 61 / 0.07) 1px, transparent 1px), linear-gradient(90deg, rgb(31 90 61 / 0.07) 1px, transparent 1px);
  background-size: 28px 28px; background-position: center; transition: opacity 0.9s cubic-bezier(.4, 0, .2, 1), visibility 0.9s; }
#intro.out { opacity: 0; visibility: hidden; }
.intro-stage { transition: transform 0.9s cubic-bezier(.4, 0, .2, 1), filter 0.9s ease; }
#intro.out .intro-stage { transform: scale(1.06) translateY(-8px); filter: blur(3px); }
.intro-stage { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px; text-align: center; }
.intro-house { width: min(300px, 70vw); height: auto; overflow: visible; }
.intro-house .ln { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: introDraw 0.95s cubic-bezier(.45, 0, .25, 1) forwards; }
.intro-house .dim { stroke-width: 1.2; opacity: 0.6; }
.intro-house .inner { animation: introDraw 0.95s cubic-bezier(.45, 0, .25, 1) forwards, introLight 0.6s ease-out 1.8s forwards; }
@keyframes introLight { to { stroke: rgb(255 255 255 / 0.6); } }
.intro-house .fill { fill: var(--accent); opacity: 0; animation: introFade 0.7s ease-out 1.7s forwards; }
.intro-house .leaf { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform-origin: 110px 98px; transform: scale(0.4); animation: introPop 0.6s cubic-bezier(.3, 1.45, .5, 1) 2.15s forwards; }
.intro-word { font-family: var(--font-display); font-weight: 900; font-size: clamp(2.4rem, 7vw, 4rem); letter-spacing: -0.03em; color: var(--fg); line-height: 1; opacity: 0; transform: translateY(10px); animation: introUp 0.7s ease-out 2.5s forwards; }
.intro-sub { font-weight: 700; color: var(--accent); font-size: clamp(0.95rem, 2.2vw, 1.15rem); opacity: 0; animation: introUp 0.7s ease-out 2.9s forwards; }
.intro-skip { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 20px); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); border: 0; border-radius: 999px; padding: 8px 14px;
  background: var(--t-mint); color: var(--accent); font: 700 0.85rem var(--font-body); cursor: pointer; }
.intro-skip:hover { background: var(--t-sage); }
@keyframes introDraw { to { stroke-dashoffset: 0; } }
@keyframes introFade { to { opacity: 1; } }
@keyframes introPop { to { opacity: 1; transform: scale(1); } }
@keyframes introUp { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .intro-house .ln, .intro-house .fill, .intro-house .leaf, .intro-word, .intro-sub { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
  #intro, .intro-stage { transition: none; } #intro.out .intro-stage { transform: none; filter: none; }
}

<script>
  // Intro einmal pro Sitzung; ohne Sitzungsspeicher (z. B. Vorschaubild) gar nicht zeigen
  (function () {
    var el = document.getElementById('intro'); if (!el) return;
    var seen = true, lang = 'de';
    try { seen = sessionStorage.getItem('gp_intro_seen') === '1'; if (!seen) sessionStorage.setItem('gp_intro_seen', '1'); } catch (e) { seen = true; }
    try { lang = localStorage.getItem('obc_lang') === 'en' ? 'en' : 'de'; } catch (e) { /* */ }
    if (seen) { el.remove(); return; }
    if (lang === 'en') { document.getElementById('introSub').textContent = 'Energy efficiency and life cycle assessment for your project planning'; document.getElementById('introSkip').textContent = 'Skip'; }
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var done = false;
    function finish() { if (done) return; done = true; el.classList.add('out'); setTimeout(function () { el.remove(); }, reduce ? 0 : 950); }
    setTimeout(finish, reduce ? 1200 : 4400);
    el.addEventListener('click', finish);
    document.addEventListener('keydown', function onKey() { finish(); document.removeEventListener('keydown', onKey); });
  })();
</script>
